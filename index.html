<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>NAYAB | Haute Horlogerie & Contemporary Pakistani Watchmaking</title>
    <meta name="description" content="NAYAB is an independent luxury watch house crafting mechanical timepieces defined by patience, regional metallurgy, and generational permanence in Lahore, Pakistan." />
    <meta name="keywords" content="luxury watches Pakistan, haute horlogerie, mechanical watches, in-house calibres, Lahore watchmaking, sovereign 39, zar perpetual, mehr 36, karakoram 42" />
    <meta name="author" content="NAYAB Fine Watchmaking" />
    <meta name="theme-color" content="#070707" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://nayabwatches.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NAYAB Fine Watchmaking" />
    <meta property="og:title" content="NAYAB | Haute Horlogerie & Contemporary Pakistani Watchmaking" />
    <meta property="og:description" content="An independent luxury watch house crafting mechanical timepieces defined by patience, regional metallurgy, and generational permanence from Lahore, Pakistan." />
    <meta property="og:image" content="https://nayabwatches.com/images/sovereign-39-front.png" />
    <meta property="og:url" content="https://nayabwatches.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@nayabwatches" />
    <meta name="twitter:title" content="NAYAB | Haute Horlogerie & Contemporary Pakistani Watchmaking" />
    <meta name="twitter:description" content="Mechanical timepieces shaped by patience, precision, and permanence. Conceived in the Lahore atelier." />
    <meta name="twitter:image" content="https://nayabwatches.com/images/sovereign-39-front.png" />
    
    <!-- JSON-LD Structured Data: Organization & WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://nayabwatches.com/#organization",
          "name": "NAYAB Fine Watchmaking",
          "url": "https://nayabwatches.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://nayabwatches.com/favicon.svg"
          },
          "description": "Independent luxury horology house crafting mechanical timepieces in Lahore, Pakistan.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Lahore",
            "addressCountry": "PK"
          },
          "sameAs": [
            "https://instagram.com/nayabwatches"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://nayabwatches.com/#website",
          "url": "https://nayabwatches.com",
          "name": "NAYAB Fine Watchmaking",
          "publisher": {
            "@id": "https://nayabwatches.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://nayabwatches.com/watches?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts: Cormorant Garamond (Editorial Serif) & Plus Jakarta Sans / Inter (Precision Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
