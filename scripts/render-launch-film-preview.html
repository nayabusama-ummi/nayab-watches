<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NAYAB — Final Product Launch Film (HyperFrames Preview Engine)</title>
  <style>
    :root {
      --color-warm-ivory: #F8F6F0;
      --color-warm-ivory-surface: #EFE8DD;
      --color-deep-black: #070707;
      --color-black-surface: #121212;
      --color-champagne-gold: #C5A566;
      --font-serif: 'Cormorant Garamond', Garamond, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #050505;
      color: var(--color-warm-ivory);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .preview-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 100%;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      align-items: center;
    }
    .preview-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      letter-spacing: 0.05em;
      color: var(--color-warm-ivory);
    }
    .aspect-switch {
      display: flex;
      gap: 0.5rem;
      background: var(--color-black-surface);
      padding: 0.25rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .aspect-btn {
      background: none;
      border: none;
      color: #888;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .aspect-btn.active {
      background: var(--color-champagne-gold);
      color: #000;
      font-weight: 600;
    }
    .stage-wrapper {
      position: relative;
      background: var(--color-deep-black);
      border: 1px solid rgba(197, 165, 102, 0.3);
      box-shadow: 0 24px 64px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.3s, height 0.3s;
    }
    .stage-wrapper.aspect-4-5 {
      width: 480px;
      height: 600px; /* 4:5 scaled */
    }
    .stage-wrapper.aspect-16-9 {
      width: 800px;
      height: 450px; /* 16:9 scaled */
    }
    .film-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .film-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .film-video.visible {
      opacity: 0.92;
    }
    .film-overlay {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      max-width: 85%;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .film-eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--color-champagne-gold);
    }
    .film-heading {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .film-sub {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.8);
      letter-spacing: 0.05em;
    }
    /* Controls Bar */
    .controls-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      background: var(--color-black-surface);
      padding: 1rem 1.25rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .timeline-slider {
      width: 100%;
      accent-color: var(--color-champagne-gold);
      cursor: pointer;
    }
    .playback-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .play-btn {
      background: var(--color-champagne-gold);
      border: none;
      color: #000;
      font-weight: 600;
      padding: 0.4rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .time-code {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: #aaa;
    }
    .scene-tag {
      font-size: 0.8rem;
      color: var(--color-champagne-gold);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <header class="preview-header">
      <h1 class="preview-title">NAYAB Launch Film</h1>
      <div class="aspect-switch">
        <button class="aspect-btn active" onclick="setAspect('4-5')">4:5 Social</button>
        <button class="aspect-btn" onclick="setAspect('16-9')">16:9 Master</button>
      </div>
    </header>

    <div id="stageWrapper" class="stage-wrapper aspect-4-5">
      <video id="vidHeritage" class="film-video" src="/media/nayab-heritage.mp4" muted playsinline loop></video>
      <video id="vidNewModels" class="film-video" src="/media/nayab-new-models.mp4" muted playsinline loop></video>
      <video id="vidFuture" class="film-video" src="/media/nayab-future.mp4" muted playsinline loop></video>

      <div class="film-canvas">
        <div id="filmOverlay" class="film-overlay">
          <span id="filmEyebrow" class="film-eyebrow">FINE WATCHMAKING FROM PAKISTAN</span>
          <h2 id="filmHeading" class="film-heading">N A Y A B</h2>
          <p id="filmSub" class="film-sub">A legacy measured in generations.</p>
        </div>
      </div>
    </div>

    <div class="controls-bar">
      <input type="range" id="timelineSlider" class="timeline-slider" min="0" max="60" step="0.1" value="0" oninput="seekTo(this.value)">
      <div class="playback-row">
        <button id="playBtn" class="play-btn" onclick="togglePlay()">Play Film</button>
        <span id="sceneTag" class="scene-tag">Scene 1: Atelier Awakening</span>
        <span id="timeCode" class="time-code">00:00 / 01:00</span>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = false;
    let currentTime = 0;
    const duration = 60;
    let animFrame = null;

    const scenes = [
      { start: 0, end: 5, eyebrow: "FINE WATCHMAKING FROM PAKISTAN", heading: "N A Y A B", sub: "Atelier Awakening in Lahore", vid: "vidHeritage", tag: "1. Atelier Awakening" },
      { start: 5, end: 10, eyebrow: "THE ATELIER TRADITION", heading: "CRAFT\nBEFORE COMMERCE.", sub: "Hand-finished calibres & balance adjustment", vid: "vidHeritage", tag: "2. Heritage Craft" },
      { start: 10, end: 15, eyebrow: "DUAL EXPRESSIONS", heading: "SOVEREIGN 39\nMERIDIAN 41", sub: "18k Rose Gold & Architectural Titanium", vid: "vidNewModels", tag: "3. New Models Reveal" },
      { start: 15, end: 21, eyebrow: "LIVE DIGITAL MAISON", heading: "A DIGITAL MAISON,\nNOT A STOREFRONT.", sub: "The campaign becomes the product", vid: "vidNewModels", tag: "4. Live Website Experience" },
      { start: 21, end: 25, eyebrow: "PORTAL DIRECTORY", heading: "FULLSCREEN ARCHITECTURE", sub: "12-Column Responsive Directory", vid: "vidFuture", tag: "5. Menu Cascade" },
      { start: 25, end: 31, eyebrow: "THE ARCHIVE", heading: "COMPLETE COLLECTION", sub: "Interactive filtering & instant live search", vid: "vidFuture", tag: "6. All Timepieces" },
      { start: 31, end: 38, eyebrow: "HIGH COMPLICATIONS", heading: "DESIGN · MOVEMENT · FINISHING", sub: "Calibre N-02 Exploded View & Specs", vid: "vidFuture", tag: "7. Technical PDP" },
      { start: 38, end: 45, eyebrow: "FRICTIONLESS ACQUISITION", heading: "FROM SELECTION\nTO ACQUISITION.", sub: "Private allocation & armored delivery", vid: "vidHeritage", tag: "8. Commerce Flow" },
      { start: 45, end: 50, eyebrow: "ORDER RESERVATION", heading: "CERTIFICATE OF PROVENANCE", sub: "Individual serial register in Lahore", vid: "vidHeritage", tag: "9. Reservation Protocol" },
      { start: 50, end: 54, eyebrow: "THE CLIENT RECORD", heading: "CLIENT DESK & LEDGER", sub: "Verified ownership & lifetime warranty", vid: "vidHeritage", tag: "10. Client Portal" },
      { start: 54, end: 58, eyebrow: "THE HOROLOGICAL FUTURE", heading: "THE FUTURE,\nSHAPED BY TRADITION.", sub: "High-beat precision mechanical memory", vid: "vidFuture", tag: "11. Future Climax" },
      { start: 58, end: 60, eyebrow: "FULL-STACK HOROLOGY", heading: "N A Y A B", sub: "React · TypeScript · Node.js · PostgreSQL", vid: "vidFuture", tag: "12. End Lockup" }
    ];

    function setAspect(aspect) {
      const stage = document.getElementById('stageWrapper');
      document.querySelectorAll('.aspect-btn').forEach(b => b.classList.remove('active'));
      if (aspect === '4-5') {
        stage.className = 'stage-wrapper aspect-4-5';
        event.target.classList.add('active');
      } else {
        stage.className = 'stage-wrapper aspect-16-9';
        event.target.classList.add('active');
      }
    }

    function updateFrame(t) {
      currentTime = t;
      document.getElementById('timelineSlider').value = t;
      const mins = Math.floor(t / 60);
      const secs = Math.floor(t % 60);
      const ms = Math.floor((t % 1) * 10);
      document.getElementById('timeCode').textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${ms} / 01:00`;

      const curScene = scenes.find(s => t >= s.start && t < s.end) || scenes[scenes.length - 1];
      document.getElementById('filmEyebrow').textContent = curScene.eyebrow;
      document.getElementById('filmHeading').innerText = curScene.heading;
      document.getElementById('filmSub').textContent = curScene.sub;
      document.getElementById('sceneTag').textContent = curScene.tag;

      ['vidHeritage', 'vidNewModels', 'vidFuture'].forEach(id => {
        const v = document.getElementById(id);
        if (id === curScene.vid) {
          v.classList.add('visible');
          if (isPlaying && v.paused) v.play();
        } else {
          v.classList.remove('visible');
          if (!v.paused) v.pause();
        }
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').textContent = isPlaying ? "Pause Film" : "Play Film";
      if (isPlaying) {
        let lastTime = performance.now();
        function loop(now) {
          const delta = (now - lastTime) / 1000;
          lastTime = now;
          let nextTime = currentTime + delta;
          if (nextTime >= duration) nextTime = 0;
          updateFrame(nextTime);
          if (isPlaying) animFrame = requestAnimationFrame(loop);
        }
        animFrame = requestAnimationFrame(loop);
      } else {
        cancelAnimationFrame(animFrame);
      }
    }

    function seekTo(val) {
      updateFrame(parseFloat(val));
    }

    updateFrame(0);
  </script>
</body>
</html>
